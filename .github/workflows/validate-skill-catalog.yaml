name: Validate Skill Catalog

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: skill-catalog-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    outputs:
      categories: ${{ steps.distribution.outputs.categories }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.15"
          cache: ""

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # 6.5.0
        with:
          node-version: "22.22.0"
          cache: ""

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.22"
          enable-cache: false

      - name: Install locked quality-gate dependencies
        run: |
          uv --no-config venv --python python .venv
          uv --no-config pip sync --python .venv/bin/python --require-hashes \
            --only-binary :all: \
            .github/quality-gate-requirements.txt

      - name: Run tooling and credential contract tests
        run: .venv/bin/python -m unittest discover -s .github/scripts/tests -v

      - name: Verify standalone TypeScript support
        run: .venv/bin/python .github/scripts/tests/check_typescript_fixture.py

      - name: Type-check quality-gate code
        run: >-
          .venv/bin/pyright
          .github/scripts/catalog_quality.py
          .github/scripts/skill_lifecycle.py
          .github/scripts/skill_maintenance.py
          .github/scripts/publish_skills.py
          .github/scripts/tests

      - name: Validate catalog changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            reference="$BASE_SHA"
          else
            reference="$BEFORE_SHA"
          fi
          if [[ -z "$reference" || "$reference" =~ ^0+$ ]]; then
            echo "Reference commit is unavailable" >&2
            exit 1
          fi
          if ! git cat-file -e "${reference}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$reference"
          fi
          .venv/bin/python .github/scripts/catalog_quality.py \
            --changed-from "$reference"
          .venv/bin/python .github/scripts/skill_lifecycle.py validate \
            --changed-from "$reference"
          .venv/bin/python .github/scripts/skill_lifecycle.py catalog --check
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

      - name: Test isolated skill distributions
        env:
          REFERENCE: ${{ steps.scope.outputs.reference }}
        run: .venv/bin/python .github/scripts/skill_lifecycle.py checks --changed-from "$REFERENCE"

      - name: Prepare immutable release artifacts
        run: .venv/bin/python .github/scripts/skill_lifecycle.py bundle --output build/releases

      - name: Read configured category destinations
        id: distribution
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          config = json.loads(Path('.github/skill-catalog.json').read_text())
          print('categories=' + json.dumps([name for name, item in config['categories'].items() if item['repository']]))
          PY

      - name: Save validated artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-releases-${{ github.sha }}
          path: build/releases/
          if-no-files-found: error
          retention-days: 14

  publish-releases:
    needs: validate-catalog
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: skill-releases-${{ github.sha }}
          path: build/releases/
      - name: Publish independently versioned skills
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/publish_skills.py releases --artifacts build/releases --repo "$REPOSITORY"

  publish-categories:
    needs: [validate-catalog, publish-releases]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        category: ${{ fromJSON(needs.validate-catalog.outputs.categories) }}
    concurrency:
      group: skill-distribution-${{ matrix.category }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publish category only when exported content differs
        env:
          SYNC_AISAS_KILLS_TOKEN: ${{ secrets.SYNC_AISAS_KILLS_TOKEN }}
          CATEGORY: ${{ matrix.category }}
        run: python3 .github/scripts/publish_skills.py category --category "$CATEGORY"
