name: Monitor Skill Freshness

on:
  schedule:
    - cron: '0 1 * * *' # Daily at 09:00 Asia/Shanghai (01:00 UTC).
  workflow_dispatch:
  repository_dispatch:
    types: [skill-upstream-changed]

permissions:
  contents: read

concurrency:
  group: skill-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.15'
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.11.22'
          enable-cache: false
      - name: Install locked monitoring dependencies
        run: |
          uv --no-config venv --python python .venv
          uv --no-config pip sync --python .venv/bin/python --require-hashes --only-binary :all: .github/quality-gate-requirements.txt
      - name: Restore previous observations
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          result = subprocess.run(['gh', 'api', f"repos/{os.environ['REPOSITORY']}/contents/state.json?ref=skill-maintenance-state", '-H', 'Accept: application/vnd.github.raw+json'], capture_output=True, text=True)
          if result.returncode == 0:
              json.loads(result.stdout)
              Path('/tmp/skill-previous-state.json').write_text(result.stdout)
          elif 'HTTP 404' not in result.stderr:
              raise SystemExit('Unable to restore monitor state')
          PY
      - name: Observe upstreams and generate warnings
        env:
          AISA_MONITOR_MCP_TOKEN: ${{ secrets.AISA_MONITOR_MCP_TOKEN }}
        run: .venv/bin/python .github/scripts/skill_maintenance.py scan --previous /tmp/skill-previous-state.json --output build/maintenance
      - name: Save observations independently of main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/publish_skills.py state --directory build/maintenance --repo "$REPOSITORY"
      - name: Update maintenance issues on meaningful changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: .venv/bin/python .github/scripts/skill_maintenance.py notify --report build/maintenance/report.json --repo "$REPOSITORY"
      - name: Show daily report
        if: always()
        run: |
          if [[ -f build/maintenance/report.md ]]; then
            cat build/maintenance/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save monitoring evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-maintenance-${{ github.run_id }}
          path: build/maintenance/
          retention-days: 30
